<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Skill Post — Microswab</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
  <style>
  :root {
    --bg-main: #0f0f0f;
    --bg-card: #151515;
    --bg-input: #111;
    --border-soft: #262626;
    --text-muted: #9a9a9a;
    --accent: #00ff88;
    --accent-dark: #00cc66;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 10px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-main);
    color: #fff;
    min-height: 100vh;
  }

  /* ===== Top Bar ===== */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: rgba(20, 20, 20, 0.95);
    border-bottom: 1px solid var(--border-soft);
    backdrop-filter: blur(8px);
  }

  .top-bar h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }

  #nextBtn {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #nextBtn.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ===== Main Sections ===== */
  .stage-one,
  .editor-area {
    padding: 20px 16px 28px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ===== Upload Card ===== */
  .image-box {
    background: var(--bg-card);
    border: 1px dashed var(--border-soft);
    border-radius: var(--radius-lg);
    height: 260px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }

  .image-box:hover {
    border-color: #333;
  }

  .image-box h3 {
    font-size: 14px;
    margin-bottom: 8px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .green {
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
  }

  #previewImage,
  #previewVideo {
    display: none;
    width: 100%;
    height: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: var(--radius-lg);
  }

  /* ===== Video Upload Button ===== */
  .video-upload-btn {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    font-size: 14px;
    margin-bottom: 18px;
  }

  .video-upload-btn span {
    color: var(--accent);
    font-weight: 600;
  }

  /* ===== Editor Area ===== */
  .editor-area {
    display: none;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ===== Inputs ===== */
  .input-box {
    margin-bottom: 16px;
  }

  .input-box label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #e5e5e5;
  }

  .input-box input,
  .input-box textarea,
  .input-box select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    color: #fff;
    font-size: 14px;
    padding: 12px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-box input:focus,
  .input-box textarea:focus,
  .input-box select:focus {
    border-color: var(--accent);
  }

  textarea {
  resize: vertical;
  min-height: 180px;
  line-height: 1.6;
  font-size: 15px;
  padding: 14px;
}

  /* ===== Action Button ===== */
  .finish-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    text-align: center;
    padding: 14px;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .finish-btn:active {
    transform: scale(0.98);
  }

  .finish-btn:hover {
    background: var(--accent-dark);
  }

  /* ===== Upload Progress ===== */
  .uploading-text {
    text-align: center;
    color: var(--accent);
    margin-top: 14px;
    display: none;
    font-weight: 600;
    font-size: 14px;
  }

  .progress-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
    justify-content: center;
    color: var(--accent);
  }

  .progress-bar {
    width: 180px;
    height: 8px;
    background: var(--bg-input);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border-soft);
  }

  .progress-bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    transition: width 0.25s ease;
  }

  .spinner {
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 1s linear infinite;
  }
  .lesson-images {
  margin: 10px 0 18px;
}

.add-image-btn {
  background: #111;
  border: 1px dashed #333;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
  color: #00ff88;
  cursor: pointer;
}

.image-preview-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.image-preview-row img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
}

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ===== Desktop polish ===== */
  @media (min-width: 768px) {
    .stage-one,
    .editor-area {
      padding-top: 28px;
    }
  }
</style>
</head>
<body>

  <span onclick="history.back()" style="font-size:18px; cursor:pointer;">←</span>

<div class="stage-one" id="stageOne">

 <textarea id="session2Text"></textarea>
 <div class="lesson-images" id="session2Images">

</div>
  <label>Session 2 Quiz Question</label>

  <hr style="margin:20px 0; border-color:#333;">

<div class="lesson-images" id="session3Images">

</div>
  <label>Session 3 Quiz Question</label>

  <input type="text" id="session3Option1" placeholder="Option 1">
  <input type="text" id="session3Option2" placeholder="Option 2">

  <label>Correct Answer</label>
  <select id="session3Correct">
    <option value="0">Option 1</option>
    <option value="1">Option 2</option>

  </select>

</div>
  <div class="input-box">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
const MICROSWAB_AI_UID = "nAM7ztQpGHX5XMNaF0CccGxMEHR2";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBdF5IFp9MblVQ2GUvE2NC8TsgTpVuT7dM",
  authDomain: "vs-code-d4d6b.firebaseapp.com",
  projectId: "vs-code-d4d6b",
  storageBucket: "vs-code-d4d6b.appspot.com",
  messagingSenderId: "1012283563694",
  appId: "1:1012283563694:web:f25cfd82e9f762f617d73f"
};

const cloudName = "dcpa8046h";
const uploadPreset = "microswab-profile";
const sessionImages = {
  1: [],
  2: [],
  3: []
};

window.triggerImageUpload = function(sessionNumber) {
  document.getElementById(`session${sessionNumber}ImageInput`).click();
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

[1,2,3].forEach(num => {
  const input = document.getElementById(`session${num}ImageInput`);
  const preview = document.getElementById(`session${num}Preview`);

  if (!input) return;

  input.addEventListener("change", () => {
    const files = Array.from(input.files);

    if (sessionImages[num].length + files.length > 3) {
      alert("Maximum 3 images allowed per session.");
      return;
    }

    files.forEach(file => {
      sessionImages[num].push(file);

      const wrapper = document.createElement("div");
wrapper.style.position = "relative";
wrapper.style.display = "inline-block";
wrapper.style.margin = "5px";

// Image
const img = document.createElement("img");
img.src = URL.createObjectURL(file);
img.style.width = "90px";
img.style.height = "90px";
img.style.objectFit = "cover";
img.style.borderRadius = "10px";

// Cancel button
const cancelBtn = document.createElement("div");
cancelBtn.textContent = "✕";
cancelBtn.style.position = "absolute";
cancelBtn.style.top = "4px";
cancelBtn.style.right = "6px";
cancelBtn.style.background = "rgba(0,0,0,0.6)";
cancelBtn.style.color = "#fff";
cancelBtn.style.fontSize = "12px";
cancelBtn.style.padding = "2px 6px";
cancelBtn.style.borderRadius = "50%";
cancelBtn.style.cursor = "pointer";

// Remove logic
cancelBtn.onclick = () => {
  // Remove from array
  const index = sessionImages[num].indexOf(file);
  if (index > -1) {
    sessionImages[num].splice(index, 1);
  }

  // Remove from UI
  wrapper.remove();
};

wrapper.appendChild(img);
wrapper.appendChild(cancelBtn);
preview.appendChild(wrapper);
    });

    input.value = "";
  });
});

const nextBtn = document.getElementById("nextBtn");
const imageInput = document.getElementById("imageInput");
const videoInput = document.getElementById("videoInput");
const previewImage = document.getElementById("previewImage");
const previewVideo = document.getElementById("previewVideo");
const stageOne = document.getElementById("stageOne");
const editorSection = document.getElementById("editorSection");
const uploadBtn = document.getElementById("uploadBtn");
const uploadingText = document.getElementById("uploadingText");
const progressRow = document.getElementById("progressRow");
const progressFill = document.getElementById("progressFill");
const progressPercent = document.getElementById("progressPercent");

let fileSelected = null;
let fileType = null;
let currentUser = null;

onAuthStateChanged(auth, (user) => { currentUser = user || null; });

// File preview
imageInput.addEventListener("change", () => {
  if (imageInput.files[0]) {
    fileSelected = imageInput.files[0];
    fileType = "image";
    previewImage.src = URL.createObjectURL(fileSelected);
    previewImage.style.display = "block";
    previewVideo.style.display = "none";

    // Show course field
    document.getElementById("courseBox").style.display = "block";

    nextBtn.classList.add("active");
  }
});

videoInput.addEventListener("change", () => {
  if (videoInput.files[0]) {
    fileSelected = videoInput.files[0];
    fileType = "video";
    previewVideo.src = URL.createObjectURL(fileSelected);
    previewVideo.style.display = "block";
    previewImage.style.display = "none";

    // Hide course field for video posts
    document.getElementById("courseBox").style.display = "none";

    nextBtn.classList.add("active");
  }
});

// Next button
nextBtn.addEventListener("click", () => {
  if (!fileSelected) return;
  stageOne.style.display = "none";
  editorSection.style.display = "block";
  document.getElementById("skillTitle").focus();
});

// Get user profile
async function getUserProfile(userId){
  const docRef = doc(db, "users", userId);
  const docSnap = await getDoc(docRef);
  if(docSnap.exists()){
    return docSnap.data();
  } else {
    return { displayName: currentUser.email, photoURL: "https://via.placeholder.com/100" };
  }
}
async function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = (e) => {
      img.src = e.target.result;
    };

    img.onload = () => {
      const canvas = document.createElement("canvas");

      // Resize logic (max width 800px)
      const MAX_WIDTH = 800;
      let width = img.width;
      let height = img.height;

      if (width > MAX_WIDTH) {
        height = height * (MAX_WIDTH / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      // Compress to 70% quality
      canvas.toBlob(
        (blob) => {
          resolve(new File([blob], file.name, { type: "image/jpeg" }));
        },
        "image/jpeg",
        0.7
      );
    };

    reader.readAsDataURL(file);
  });
}

// Upload skill
uploadBtn.addEventListener("click", async () => {
  /* ===== IMAGE PREVIEW + LIMIT LOGIC ===== */
  const title = document.getElementById("skillTitle").value.trim();
  const bio = document.getElementById("skillBio").value.trim();
  let sessions = [];

if (fileType === "image") {

  async function buildSession(
  textId, qId, o1, o2, o3, correctId, sessionNumber
) {
  async function uploadSessionImages(imagesArray) {
  const uploadedURLs = [];

  for (let file of imagesArray) {
    try {
      const compressedFile = await compressImage(file);

      const form = new FormData();
      form.append("file", compressedFile);
      form.append("upload_preset", uploadPreset);

      const res = await fetch(
        `https://api.cloudinary.com/v1_1/${cloudName}/upload`,
        { method: "POST", body: form }
      );

      const data = await res.json();

      // ✅ IMPORTANT: check if upload worked
      if (!data.secure_url) {
        console.error("Cloudinary upload failed:", data);
        continue; // skip broken image instead of killing everything
      }

      uploadedURLs.push(data.secure_url);

    } catch (err) {
      console.error("Image upload error:", err);
      // ❌ DO NOT break everything
      continue;
    }
  }

  return uploadedURLs;
}
  const content = document.getElementById(textId).value.trim();
  const question = document.getElementById(qId).value.trim();
  const option1 = document.getElementById(o1).value.trim();
  const option2 = document.getElementById(o2).value.trim();
  const option3 = document.getElementById(o3).value.trim();
  const correctIndex = parseInt(document.getElementById(correctId).value);

  // ✅ Only Session 1 is REQUIRED
if (sessionNumber === 1) {
  if (!content || !question || !option1 || !option2 || !option3) {
    alert("Session 1 is required.");
    throw new Error("Session 1 incomplete");
  }
}

// ✅ Session 2 & 3 are OPTIONAL
if (sessionNumber !== 1) {
  if (!content && !question) {
    return null; // skip empty session
  }

  // If teacher started writing → force completion
  if (!content || !question || !option1 || !option2 || !option3) {
    alert("If you start Session " + sessionNumber + ", complete it fully.");
    throw new Error("Incomplete optional session");
  }
}

  const uploadedImageURLs = await uploadSessionImages(sessionImages[sessionNumber]);

  return {
    content,
    images: uploadedImageURLs,
    quiz: {
      question,
      options: [option1, option2, option3],
      correctIndex
    }
  };
}

  

let s1, s2, s3;

try {
  s1 = await buildSession(
    "session1Text",
    "session1Question",
    "session1Option1",
    "session1Option2",
    "session1Option3",
    "session1Correct",
    1
  );

  s2 = await buildSession(
    "session2Text",
    "session2Question",
    "session2Option1",
    "session2Option2",
    "session2Option3",
    "session2Correct",
    2
  );

  s3 = await buildSession(
    "session3Text",
    "session3Question",
    "session3Option1",
    "session3Option2",
    "session3Option3",
    "session3Correct",
    3
  );

} catch (err) {
  console.error("Session build failed:", err);

  uploadingText.style.display = "none";
  progressRow.style.display = "none";
  uploadBtn.style.pointerEvents = "auto";
  uploadBtn.style.opacity = "1";

  return; // stop upload completely
}
  if (s1) sessions.push(s1);
  if (s2) sessions.push(s2);
  if (s3) sessions.push(s3);

  if (sessions.length === 0) {
    alert("Please complete at least Session 1 with quiz.");
    return;
  }
}
  const privacy = document.getElementById("privacy").value;

 if(!title || !bio || !fileSelected || (fileType==="image" && sessions.length === 0)){
  alert("Please fill all required fields!");
  return;
}

  if(!currentUser){
    alert("Please log in to upload.");
    window.location.href = "login.html";
    return;
  }
// ✅ Instant feedback (button + div)
uploadBtn.textContent = "Uploading...";
uploadBtn.style.pointerEvents = "none";
uploadBtn.style.opacity = "0.6";

// Show div immediately with first message
uploadingText.style.display = "block";
uploadingText.textContent = "Preparing upload...";
progressRow.style.display = "none";

// ⏳ Then switch to real uploading UI
setTimeout(() => {
  uploadingText.textContent = "Uploading skill...";
  progressRow.style.display = "flex";
}, 800);

  try {
    // Upload to Cloudinary
    const form = new FormData();
    let uploadFile = fileSelected;

if (fileType === "image") {
  uploadFile = await compressImage(fileSelected);
}

form.append("file", uploadFile);
    form.append("upload_preset", uploadPreset);

    progressFill.style.width = `10%`;
    progressPercent.textContent = `10%`;

    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
      method: "POST",
      body: form
    });
    const cloudRes = await res.json();
    const fileURL = cloudRes.secure_url;

    progressFill.style.width = `100%`;
    progressPercent.textContent = `100%`;

    const userProfile = await getUserProfile(currentUser.uid);
    const posterName = userProfile.displayName || currentUser.email;
    const posterPhoto = userProfile.photoURL || "https://via.placeholder.com/100";

    const skillDoc = {
  title,
  bio,
  privacy,
  fileType,
  posterName,
  posterPhoto,
  posterUserId: currentUser.uid,
  likes: 0,
  likesArray: [],
  views: 0,
  viewsArray: [],
  comments: [],
  shares: 0,
  postType:
  currentUser.uid === MICROSWAB_AI_UID && fileType === "image"
    ? "challenge"
    : fileType === "video"
    ? "video"
    : "skill",
  // Save full course only for skill posts
  sessions: fileType === "image" ? sessions : [],
  createdAt: serverTimestamp()
};

    if(fileType === "video") skillDoc.videoURL = fileURL;
    else skillDoc.fileURL = fileURL;

    const docRef = await addDoc(collection(db, "skills"), skillDoc);

// 🔔 Add notification to global collection
await addDoc(collection(db, "allNotifications"), {
  message: "A teacher just posted a new skill — go check it out!",
  skillId: docRef.id,  // optional, if you want to link to the skill later
  createdAt: serverTimestamp(),
  read: false,
  posterUserId: currentUser.uid
});
uploadingText.textContent = "Upload complete — redirecting…";
uploadBtn.textContent = "Upload Skill";

// Redirect logic
setTimeout(() => {
  // Founder challenge
  if (
    currentUser.uid === MICROSWAB_AI_UID &&
    fileType === "image"
  ) {
    window.location.href = `challenge.html?challengeId=${docRef.id}`;
  }
  // Video posts
  else if (fileType === "video") {
    window.location.href = "reels.html";
  }
  // Normal skill posts
  else {
    window.location.href = `teacherchat.html?skillId=${docRef.id}`;
  }
}, 650);
  } catch(err){
    uploadBtn.textContent = "Upload Skill";
    console.error("Upload error:", err);
    alert("Upload failed. Check console.");
    uploadingText.style.display="none";
    progressRow.style.display="none";
    uploadBtn.style.pointerEvents="auto";
    uploadBtn.style.opacity="1";
  }
});
function enforceWordLimit(textareaId, maxWords) {
  const textarea = document.getElementById(textareaId);

  textarea.addEventListener("input", () => {
    const words = textarea.value.trim().split(/\s+/);

    if (words.length > maxWords) {
      textarea.value = words.slice(0, maxWords).join(" ");
      alert(`Maximum ${maxWords} words allowed.`);
    }
  });
}
</script>
